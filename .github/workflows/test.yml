name: Runepkg CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly periodic fuzzing / regression check

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang clang-tools libssl-dev g++ libcurl4-openssl-dev zlib1g-dev

      - name: Build and Static Analysis
        run: |
          cd runepkg
          make
          make static-analysis

      - name: Run Integration Tests
        run: |
          cd runepkg/tests/integration
          make

      - name: Run Fuzzing Campaign
        run: |
          cd runepkg/tests/fuzz
          make
          ./fuzz_sanitize_path -runs=5000
