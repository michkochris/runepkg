<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Stone Gradient -->
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <!-- Glowing Rune Gradient -->
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Bevel Highlight -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Rune Tablet (Hexagonal Facet) -->
  <polygon points="16,2 29,8 29,24 16,30 3,24 3,8" 
           fill="url(#stoneGrad)" 
           stroke="#2d3748" 
           stroke-width="1.5" 
           stroke-linejoin="round"/>

  <!-- Top Edge Light Accent -->
  <polygon points="16,2 29,8 25,10 16,5 7,10 3,8" 
           fill="url(#bevelGrad)"/>

  <!-- Carved Box Facet (Top Flap Indicator) -->
  <path d="M16,5 L26,10 L16,15 L6,10 Z" 
        fill="none" 
        stroke="#475569" 
        stroke-width="1.2" 
        stroke-linejoin="round"/>

  <!-- Core Glowing Rune Core / Debian-Inspired Fast Rune Motif -->
  <path d="M16,7 
           V25 
           M16,10 
           L23,14.5 
           L16,19 
           L9,14.5 
           Z 
           M16,19 
           L22,22.5" 
        fill="none" 
        stroke="url(#runeGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Center Energy Core Spark -->
  <circle cx="16" cy="14.5" r="1.5" fill="#f8fafc"/>
</svg>
